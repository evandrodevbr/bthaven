name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tests are restored through the test project, which pulls BTHaven.Core in transitively.
      - name: Restore
        run: dotnet restore tests/BTHaven.Core.Tests/BTHaven.Core.Tests.csproj

      # BTHaven.Core and BTHaven.Core.Tests target plain net10.0 and have no Windows dependency,
      # so this job is a real build-and-run verification, not a compile-only check.
      - name: Build and run unit tests
        run: dotnet test tests/BTHaven.Core.Tests/BTHaven.Core.Tests.csproj -c Release --no-restore

  windows-targets:
    name: Windows targets (compile-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # These projects target net10.0-windows10.0.26100.0. Without EnableWindowsTargeting they
      # fail with NETSDK1100, and the Windows SDK projection is restored from NuGet, so a
      # non-Windows runner can still type-check them. This is compile-only evidence: the code
      # cannot be executed outside Windows.
      #
      # src/BTHaven.App is intentionally excluded: the WinUI 3 XAML compiler ships as a Windows
      # binary (XamlCompiler.exe) and cannot run on Linux or macOS.
      - name: Compile Windows-targeted projects
        run: |
          set -euo pipefail
          projects=(
            src/BTHaven.Windows/BTHaven.Windows.csproj
            tests/BTHaven.IntegrationTests/BTHaven.IntegrationTests.csproj
            probes/Common/BTHaven.Probes.Common.csproj
            probes/01-device-enumeration/01-device-enumeration.csproj
            probes/02-battery/02-battery.csproj
            probes/03-a2dp-sink/03-a2dp-sink.csproj
            probes/04-phone-hfp/04-phone-hfp.csproj
            probes/05-call-audio-routing/05-call-audio-routing.csproj
          )
          for project in "${projects[@]}"; do
            echo "::group::dotnet build ${project}"
            dotnet build "${project}" -c Release -p:EnableWindowsTargeting=true
            echo "::endgroup::"
          done
