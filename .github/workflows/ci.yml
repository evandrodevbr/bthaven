name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Tests marked with these traits need real Bluetooth/audio hardware and are
  # never executed in CI. Keep this list in sync with the [Trait("RequiresHardware", ...)]
  # values used in tests/BTHaven.IntegrationTests.
  HARDWARE_TRAIT_FILTER: "RequiresHardware!=Bluetooth&RequiresHardware!=Audio&RequiresHardware!=BluetoothAudio"

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore BTHaven.slnx --locked-mode

      - name: Build
        run: dotnet build BTHaven.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test BTHaven.Core.Tests
        run: dotnet test tests/BTHaven.Core.Tests/BTHaven.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Test BTHaven.IntegrationTests (hardware-free)
        run: dotnet test tests/BTHaven.IntegrationTests/BTHaven.IntegrationTests.csproj -c Release --no-restore --filter "$env:HARDWARE_TRAIT_FILTER" --verbosity normal
